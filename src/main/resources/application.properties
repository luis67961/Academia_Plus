spring.application.name=plus-twenty-academic
spring.datasource.url=jdbc:h2:file:./data/academia
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
server.port=${PORT:8080}
server.servlet.session.tracking-modes=cookie

# Demo local. Para compartirlo, configurar un despliegue con cuentas propias.
server.address=127.0.0.1
spring.web.locale=es_PE
spring.web.locale-resolver=fixed

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
