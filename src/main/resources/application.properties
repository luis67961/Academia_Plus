spring.application.name=plustwenty
server.port=8080

# ---------- MySQL local ----------
# La base de datos se crea sola si no existe (createDatabaseIfNotExist=true).
# Usuario y clave se pueden cambiar aquí o con variables de entorno DB_USER / DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/plustwenty4?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=luis

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JSON ----------
spring.jackson.default-property-inclusion=always
server.error.include-message=always

# ---------- Sesión ----------
server.servlet.session.timeout=12h
server.servlet.session.cookie.max-age=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# ---------- Datos de demostración ----------
# Carga los datos de ejemplo (seed/seed.json) cuando la base está vacía.
plustwenty.seed.enabled=true
# Habilita el enlace "Restablecer datos demo" del login (solo desde el mismo equipo: localhost).
plustwenty.demo.reset-enabled=true
server.port=8084