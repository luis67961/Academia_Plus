spring.application.name=plustwenty

# ---------- Puerto del servidor ----------
# Render inyecta la variable PORT automáticamente. En tu PC mantendrá el puerto 8084.
server.port=${PORT:8084}

# ---------- Conexión a Base de Datos ----------
# Las credenciales NO se versionan. En Render/Aiven se inyectan por variables de
# entorno (DB_URL, DB_USER, DB_PASSWORD). Para desarrollo local, copia
# config/db.properties.example a config/db.properties (ignorado por git) y pon ahí tu contraseña.
spring.config.import=optional:file:./config/db.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/plustwenty4?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JSON ----------
spring.jackson.default-property-inclusion=always
server.error.include-message=always

# ---------- Sesión ----------
server.servlet.session.timeout=12h
server.servlet.session.cookie.max-age=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# ---------- Datos de demostración ----------
# Carga los datos de ejemplo (seed/seed.json) cuando la base está vacía.
plustwenty.seed.enabled=true
# Habilita el enlace "Restablecer datos demo" del login.
plustwenty.demo.reset-enabled=true