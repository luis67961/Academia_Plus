<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Estudiante y Apoderado · PLUSTWENTY</title>
  <meta name="description" content="Portal de autoservicio para estudiantes y apoderados: consulta de matrículas, cronograma de pensiones, reporte de pagos y recibos digitales.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#1F2937', 900: '#111827', 950: '#0B1220' },
            brand: '#2563EB',
            ok: '#16A34A',
            bad: '#DC2626'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#F3F6FB] min-h-screen">
  <!-- Overlay móvil para sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar Lateral del Estudiante / Apoderado -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <span data-logo="40"></span>
      <div>
        <p class="brand-tag" style="margin-top:.35rem">Portal del Estudiante</p>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Navegación del portal del estudiante">
      <div class="nav-section">Mi Portal</div>
      <a href="#inicio" class="nav-link" data-view="inicio" data-go="inicio">
        <i class="fa-solid fa-house"></i>
        <span>Inicio</span>
      </a>

      <div class="nav-section">Académico y Pensiones</div>
      <a href="#matriculas" class="nav-link" data-view="matriculas" data-go="matriculas">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Mis Matrículas</span>
      </a>
      <a href="#pensiones" class="nav-link" data-view="pensiones" data-go="pensiones">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Mis Pensiones</span>
      </a>
      <a href="#historial" class="nav-link" data-view="historial" data-go="historial">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Historial de Pagos</span>
      </a>

      <div class="nav-section">Trámites y Cuenta</div>
      <a href="#reportar" class="nav-link nav-cta" data-view="reportar" data-go="reportar">
        <i class="fa-solid fa-money-bill-transfer"></i>
        <span>Reportar Pago</span>
      </a>
      <a href="#perfil" class="nav-link" data-view="perfil" data-go="perfil">
        <i class="fa-solid fa-user-pen"></i>
        <span>Mi Perfil</span>
      </a>
      <a href="#notificaciones" class="nav-link" data-view="notificaciones" data-go="notificaciones">
        <i class="fa-solid fa-bell"></i>
        <span>Notificaciones</span>
        <span id="nav-badge-notif" class="nav-badge"></span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar avatar-sm" data-user-initials>VQ</div>
        <div class="min-w-0 flex-1">
          <p class="text-xs font-bold text-slate-800 truncate" data-user-name>Estudiante</p>
          <p class="text-[10px] text-slate-500" data-user-role>Estudiante</p>
        </div>
        <button type="button" class="btn-icon text-slate-500 hover:text-slate-900 hover:bg-slate-100" data-logout title="Cerrar sesión">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Contenedor Principal -->
  <div class="app-main">
    <!-- Topbar Superior -->
    <header class="topbar">
      <button type="button" class="top-btn lg:hidden" data-sidebar-toggle aria-label="Abrir menú">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="min-w-0 flex-1">
        <h2 id="page-title" class="topbar-title">Inicio</h2>
        <p id="page-subtitle" class="topbar-sub hidden sm:block">Resumen académico y estado de pensiones</p>
      </div>

      <div class="flex items-center gap-3">
        <button type="button" class="btn btn-primary btn-sm hidden sm:inline-flex" data-go="reportar">
          <i class="fa-solid fa-plus"></i>
          <span>Reportar Pago</span>
        </button>

        <button type="button" class="top-btn" data-go="notificaciones" title="Centro de Notificaciones">
          <i class="fa-solid fa-bell"></i>
          <span id="top-badge-notif" class="top-count"></span>
        </button>

        <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
          <div class="avatar" data-user-initials>VQ</div>
          <div class="hidden xl:block text-left">
            <p class="text-xs font-bold leading-tight" data-user-name>Estudiante</p>
            <p class="text-[10px] text-slate-500 font-semibold" data-user-role>Estudiante</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Contenido Dinámico de las Vistas SPA -->
    <main id="view-root" class="view-root" role="region" aria-live="polite">
      <!-- Inyectado por user.js -->
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/user.js"></script>
</body>
</html>
