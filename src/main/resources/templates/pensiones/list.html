<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div}, pageTitle='Control de Pensiones y Pagos')}">
<head>
    <title>Listado de Pensiones</title>
</head>
<body>
    <div>
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
            
            <!-- Panel Izquierdo: Buscador y Filtros -->
            <div class="xl:col-span-1 space-y-6">
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Buscar Estudiante</h3>
                    <form th:action="@{/pensiones/buscar}" method="GET">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">DNI o Apellidos</label>
                            <input type="text" name="query" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Ingresar DNI..." required>
                        </div>
                        <button type="submit" class="w-full px-4 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 font-medium transition-colors">
                            Buscar Estado de Cuenta
                        </button>
                    </form>
                </div>

                <!-- Resumen Financiero Rápido -->
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
                    <h3 class="text-md font-semibold text-gray-800 mb-4">Resumen del Mes</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                            <span class="text-gray-600">Cobrado:</span>
                            <span class="text-emerald-600 font-bold">S/ 42,500.00</span>
                        </div>
                        <div class="flex justify-between items-center pb-2">
                            <span class="text-gray-600">Pendiente:</span>
                            <span class="text-red-500 font-bold">S/ 8,400.00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panel Derecho: Lista de Deudas / Pagos del Estudiante (Si se buscó a uno) -->
            <div class="xl:col-span-2">
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden h-full">
                    
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-gray-800" th:text="${estudiante != null ? 'Estado de Cuenta: ' + estudiante.nombres : 'Últimos Pagos Registrados'}">Últimos Pagos Registrados</h2>
                        <button th:if="${estudiante != null}" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 px-4 rounded-lg transition-colors text-sm">
                            Registrar Nuevo Pago
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100">
                                    <th class="px-6 py-4 font-medium">Concepto</th>
                                    <th class="px-6 py-4 font-medium">Vencimiento</th>
                                    <th class="px-6 py-4 font-medium">Monto</th>
                                    <th class="px-6 py-4 font-medium text-center">Estado</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                
                                <!-- Iterador Thymeleaf para Pensiones -->
                                <tr th:each="pension : ${pensiones}" class="hover:bg-gray-50 transition-colors">
                                    <td class="px-6 py-4 text-sm font-medium text-gray-800" th:text="${pension.concepto}">Pensión Agosto 2026</td>
                                    <td class="px-6 py-4 text-sm text-gray-600" th:text="${#dates.format(pension.fechaVencimiento, 'dd/MM/yyyy')}">31/08/2026</td>
                                    <td class="px-6 py-4 text-sm text-gray-600" th:text="'S/ ' + ${pension.monto}">S/ 350.00</td>
                                    <td class="px-6 py-4 text-center">
                                        <span th:if="${pension.estado == 'PAGADO'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">Pagado</span>
                                        <span th:if="${pension.estado == 'PENDIENTE'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">Pendiente</span>
                                    </td>
                                </tr>

                                <!-- Mockup Data Visual -->
                                <tr th:if="${pensiones == null}">
                                    <td class="px-6 py-4 text-sm font-medium text-gray-800">Pensión Julio 2026</td>
                                    <td class="px-6 py-4 text-sm text-gray-600">31/07/2026</td>
                                    <td class="px-6 py-4 text-sm text-gray-600">S/ 350.00</td>
                                    <td class="px-6 py-4 text-center"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">Pagado</span></td>
                                </tr>
                                <tr th:if="${pensiones == null}">
                                    <td class="px-6 py-4 text-sm font-medium text-gray-800">Pensión Agosto 2026</td>
                                    <td class="px-6 py-4 text-sm text-gray-600">31/08/2026</td>
                                    <td class="px-6 py-4 text-sm text-gray-600">S/ 350.00</td>
                                    <td class="px-6 py-4 text-center"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">Pendiente</span></td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                    
                </div>
            </div>

        </div>
    </div>
</body>
</html>
