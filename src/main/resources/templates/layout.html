<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' · Plus Twenty' : 'Plus Twenty'}">Plus Twenty</title>
    <!-- Incluyendo Tailwind compilado -->
    <link th:href="@{/css/output.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/css/demo.css}"><script src="/js/interfaz.js" defer></script></head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">

        <!-- Fondo oscuro al abrir el menú en móvil -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/60 z-20 hidden md:hidden"></div>

        <!-- Sidebar -->
        <aside id="sidebar"
               class="fixed inset-y-0 left-0 z-30 w-64 bg-slate-900 text-white flex flex-col transform -translate-x-full transition-transform duration-200 md:relative md:translate-x-0">
            <div class="flex items-center justify-between h-16 px-4 border-b border-slate-800">
                <a href="/dashboard" class="flex items-center">
                    <img src="/images/logo.png" alt="Plus Twenty" class="brand-logo">
                </a>
                <button type="button" id="sidebar-close" class="md:hidden text-slate-400 hover:text-white" aria-label="Cerrar menú">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-1">
                <a href="/dashboard"
                   class="flex items-center px-4 py-2 rounded-lg transition-colors hover:bg-slate-800 hover:text-white"
                   th:attr="aria-current=${activeNav == 'dashboard' ? 'page' : null}" th:classappend="${activeNav == 'dashboard'} ? 'bg-slate-800 text-white font-medium' : 'text-slate-300'">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Resumen
                </a>
                <a href="/matriculas"
                   class="flex items-center px-4 py-2 rounded-lg transition-colors hover:bg-slate-800 hover:text-white"
                   th:attr="aria-current=${activeNav == 'matriculas' ? 'page' : null}" th:classappend="${activeNav == 'matriculas'} ? 'bg-slate-800 text-white font-medium' : 'text-slate-300'">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Matrículas
                </a>
                <a href="/pensiones"
                   class="flex items-center px-4 py-2 rounded-lg transition-colors hover:bg-slate-800 hover:text-white"
                   th:attr="aria-current=${activeNav == 'pensiones' ? 'page' : null}" th:classappend="${activeNav == 'pensiones'} ? 'bg-slate-800 text-white font-medium' : 'text-slate-300'">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Pensiones y Pagos
                </a>
                <a href="/programas" th:attr="aria-current=${activeNav == 'programas' ? 'page' : null}" class="flex items-center px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Cursos y grupos</a>
                <a href="/solicitudes" th:attr="aria-current=${activeNav == 'solicitudes' ? 'page' : null}" class="flex items-center px-4 py-2 rounded-lg">Solicitudes de matrícula</a>
<a href="/estudiantes" th:attr="aria-current=${activeNav == 'estudiantes' ? 'page' : null}" class="flex items-center px-4 py-2">Estudiantes y apoderados</a><a href="/asistencia" th:attr="aria-current=${activeNav == 'asistencia' ? 'page' : null}" class="flex items-center px-4 py-2">Asistencia</a><a href="/comprobantes" th:attr="aria-current=${activeNav == 'comprobantes' ? 'page' : null}" class="flex items-center px-4 py-2">Revisar comprobantes</a>            </nav>
            <div class="px-6 py-4 border-t border-slate-800 text-xs text-slate-500">
                Plus Twenty · Gestión académica
            </div>
        </aside>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Navbar -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 md:px-6 z-10">
                <div class="flex items-center">
                    <button type="button" id="sidebar-open" class="md:hidden text-gray-500 hover:text-gray-700" aria-label="Abrir menú">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <!-- Título dinámico por página -->
                    <h1 class="text-xl font-semibold text-gray-800 ml-4 md:ml-0" th:text="${pageTitle ?: 'Panel de Control'}">Panel de Control</h1>
                </div>
                <div class="flex items-center">
                    <a class="text-link profile-access" href="/perfil">Mi perfil</a><form method="post" th:action="@{/logout}"><button class="logout-button">Salir</button></form>
                    <div class="flex items-center space-x-3 cursor-pointer">
                        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold">
                            U
                        </div>
                        <span class="text-sm font-medium text-gray-700 hidden md:block">Administración</span>
                    </div>
                </div>
            </header>

            <!-- Dynamic Body Content -->
            <main class="demo flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-4 md:p-6">

                <!-- Mensajes de confirmación / error (flash attributes) -->
                <div th:if="${success}" data-flash
                     class="mb-4 flex items-start justify-between gap-3 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" role="status">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span th:text="${success}">Operación realizada.</span>
                    </div>
                    <button type="button" data-flash-close class="text-emerald-700 hover:text-emerald-900" aria-label="Cerrar">&times;</button>
                </div>
                <div th:if="${error}" data-flash
                     class="mb-4 flex items-start justify-between gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span th:text="${error}">Ocurrió un error.</span>
                    </div>
                    <button type="button" data-flash-close class="text-red-700 hover:text-red-900" aria-label="Cerrar">&times;</button>
                </div>

                <!-- Fragmento donde se inyecta el contenido de cada vista -->
                <div th:replace="${content}">
                    Contenido por defecto...
                </div>
            </main>
        </div>
    </div>


</body>
</html>
