<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div}, pageTitle='Asistencia', activeNav='asistencia')}"><head><title>Asistencia</title><script src="/js/interfaz.js" defer></script></head><body><div><section class="hero"><span class="eyebrow">SEGUIMIENTO ACADÉMICO</span><h2>Asistencia del grupo.</h2><p>Selecciona el grupo y la fecha. Los campos sin marcar se mantienen sin registro.</p></section><section class="card"><form method="get" action="/asistencia" class="row"><label>Grupo<select name="programaId" required><option value="">Selecciona</option><option th:each="p:${programas}" th:value="${p.id}" th:selected="${p.id == programaId}" th:text="${p.nombre + ' · ' + p.grupo}"></option></select></label><label>Fecha<input type="date" name="fecha" th:value="${fecha}" th:max="${hoy}" required></label><button>Ver lista</button></form></section><section class="card" th:if="${programaId != null}"><form method="post" th:action="@{/asistencia}"><input type="hidden" name="programaId" th:value="${programaId}"><input type="hidden" name="fecha" th:value="${fecha}"><div class="table-wrap"><table><caption>Asistencia para la fecha seleccionada</caption><thead><tr><th>Estudiante</th><th>DNI</th><th>Asistencia</th></tr></thead><tbody><tr th:each="m:${alumnos}"><td th:text="${m.alumno}"></td><td th:text="${m.dni}"></td><td><label th:for="${'estado_' + m.id}" class="sr-only" th:text="${'Asistencia de ' + m.alumno}"></label><select th:name="${'estado_' + m.id}" th:id="${'estado_' + m.id}"><option value="">Sin registrar</option><option th:each="e:${T(com.plustwenty.academic.model.Asistencia.Estado).values()}" th:value="${e}" th:text="${e}" th:selected="${estados[m.id] == e.name()}"></option></select></td></tr><tr th:if="${#lists.isEmpty(alumnos)}"><td colspan="3">No hay estudiantes para esta fecha y grupo.</td></tr></tbody></table></div><button th:unless="${#lists.isEmpty(alumnos)}">Guardar asistencia</button></form></section></div></body></html>
