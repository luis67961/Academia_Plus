<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Matrículas</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <h1>Listado de Matrículas</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <!-- más columnas se agregarán en los siguientes commits -->
            </tr>
        </thead>
        <tbody>
            <tr th:each="matricula : ${matriculas}">
                <td th:text="${matricula.id}">1</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
