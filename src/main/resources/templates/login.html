<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/demo.css}"><title>Plus Twenty · Academia</title></head><body class="public-body"><main class="public-main demo"><section class="login-grid"><div class="login-brand"><img src="/images/logo.png" alt="Plus Twenty"><span class="eyebrow">MATEMÁTICA · ORATORIA · LOCUCIÓN · PODCAST</span><h1>Tu aprendizaje,<br>cada vez más cerca.</h1><p>Consulta tus cursos, matrículas y pensiones en un solo lugar.</p></div><section class="card"><h2>Bienvenido a Plus Twenty</h2><p>Ingresa a tu cuenta para continuar.</p><p class="error" th:if="${param.error}">Usuario o contraseña incorrectos.</p><p th:if="${param.logout}">Sesión cerrada correctamente.</p><form method="post" th:action="@{/login}"><label>Usuario<input name="username" autocomplete="username" required autofocus></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form></section></section></main></body></html>
