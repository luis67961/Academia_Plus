<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div}, pageTitle='Ficha del estudiante', activeNav='estudiantes')}"><head><title>Ficha del estudiante</title><script src="/js/interfaz.js" defer></script></head><body><div><a class="text-link" href="/estudiantes">← Estudiantes</a><section class="hero"><span class="eyebrow" th:text="${'DNI ' + ficha.dni}"></span><h2 th:text="${ficha.nombre}"></h2><p>Saldo pendiente: <strong th:text="${'S/ ' + #numbers.formatDecimal(saldo,1,2)}"></strong></p></section><section class="card"><h3>Estudiante y responsable de contacto</h3><form method="post" th:action="@{/estudiantes/{dni}(dni=${ficha.dni})}" th:object="${ficha}"><input type="hidden" th:field="*{dni}"><div role="alert" class="validation-errors" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-grid"><label>Nombre del estudiante<input th:field="*{nombre}" maxlength="120" required></label><label>Nombre del contacto o apoderado<input th:field="*{contacto}" maxlength="120" required></label><label>Relación con el estudiante<select th:field="*{parentesco}"><option value="Estudiante">El propio estudiante</option><option value="Madre">Madre</option><option value="Padre">Padre</option><option value="Tutor">Tutor</option><option value="Otro">Otro responsable</option></select></label><label>Teléfono<input th:field="*{telefono}" type="tel" maxlength="20" required></label></div><label>Observaciones<textarea th:field="*{observaciones}" maxlength="500"></textarea></label><button>Guardar ficha</button></form></section><section class="card"><h3>Matrículas y acceso al portal</h3><article class="student-enrollment" th:each="m:${matriculas}"><h3 th:text="${m.curso + ' · ' + m.turno}"></h3><span class="badge" th:text="${m.estado}"></span> <a class="text-link" th:href="@{/pensiones(id=${m.id})}">Ver cuenta y pagos →</a><p th:if="${m.cuenta != null}" th:text="${'Cuenta vinculada: ' + m.cuenta.usuario}"></p><form th:if="${m.cuenta == null}" method="post" th:action="@{/estudiantes/{dni}/vincular(dni=${ficha.dni})}" data-confirm="¿Dar acceso a esta matrícula y sus pagos a la cuenta seleccionada?"><input type="hidden" name="matriculaId" th:value="${m.id}"><label>Cuenta de estudiante o apoderado<select name="cuentaId" required><option value="">Selecciona la cuenta</option><option th:each="c:${cuentas}" th:value="${c.id}" th:text="${c.usuario + ' · ' + (c.nombre == null ? c.rol : c.nombre)}"></option></select></label><label class="consent"><input name="identidadVerificada" value="true" type="checkbox" required><span>Verifiqué que esta cuenta pertenece al estudiante o su apoderado.</span></label><button>Vincular cuenta</button></form></article></section><section class="card"><h3>Historial de pagos</h3><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Curso</th><th>Monto</th></tr></thead><tbody><tr th:each="p:${historialPagos}"><td th:text="${#temporals.format(p.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${p.cuota.matricula.curso}"></td><td th:text="${'S/ ' + #numbers.formatDecimal(p.monto,1,2)}"></td></tr><tr th:if="${#lists.isEmpty(historialPagos)}"><td colspan="3">No hay pagos registrados.</td></tr></tbody></table></div></section></div></body></html>
