<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/demo.css}"><title>Detalle de solicitud · Plus Twenty</title></head><body class="public-body"><main class="public-main demo application-page"><header class="portal-head"><a class="text-link" th:href="${esAdmin ? '/solicitudes' : '/portal'}">← Volver a mis solicitudes</a></header><section class="hero"><span class="eyebrow" th:text="${'SOLICITUD N.º ' + detalle.id}"></span><h1 th:text="${detalle.alumno}"></h1><span class="badge" th:text="${detalle.estado}"></span><p th:if="${detalle.motivo != null}" th:text="${detalle.motivo}"></p></section><p role="status" th:if="${success}" th:text="${success}"></p><p role="alert" class="error" th:if="${error}" th:text="${error}"></p><section class="card" th:if="${detalle.estado.name() == 'PENDIENTE'}"><h2>Corregir los datos</h2><form method="post" th:action="${esAdmin} ? @{/solicitudes/{id}/editar(id=${detalle.id})} : @{/portal/solicitudes/{id}/editar(id=${detalle.id})}" th:object="${datos}"><div role="alert" class="validation-errors" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-grid"><label>Estudiante<input th:field="*{alumno}" maxlength="120" required></label><label>DNI<input th:field="*{dni}" pattern="[0-9]{8}" maxlength="8" required></label><label>Contacto<input th:field="*{contacto}" maxlength="120" required></label><label>Teléfono<input th:field="*{telefono}" type="tel" maxlength="20" required></label></div><label>Curso y grupo<select th:field="*{programaId}" required><option th:each="p:${programas}" th:value="${p.id}" th:text="${p.nombre + ' · ' + p.grupo + ' · ' + p.turno}"></option></select></label><label>Turno<select th:field="*{turno}"><option th:each="t:${turnos}" th:value="${t}" th:text="${t}"></option></select></label><input type="hidden" name="aceptaContacto" value="true"><button>Guardar corrección</button></form></section><section class="card" th:if="${detalle.estado.name() == 'PENDIENTE'}"><h2>Resolver solicitud</h2><form th:if="${esAdmin}" method="post" th:action="@{/solicitudes/{id}/confirmar(id=${detalle.id})}" data-confirm="¿Confirmar la matrícula y generar sus cuotas?"><p th:text="${detalle.programa.cuotas + ' cuotas de S/ ' + #numbers.formatDecimal(detalle.programa.pension,1,2)}"></p><label class="consent"><input type="checkbox" required><span>He coordinado el grupo, turno y tarifa con el contacto.</span></label><button>Confirmar matrícula</button></form><form method="post" th:action="${esAdmin} ? @{/solicitudes/{id}/cerrar(id=${detalle.id})} : @{/portal/solicitudes/{id}/cancelar(id=${detalle.id})}" data-confirm="¿Cerrar esta solicitud? Se conservará el historial."><label th:if="${esAdmin}">Acción<select name="estado"><option value="RECHAZADA">Rechazar</option><option value="CANCELADA">Cancelar</option></select></label><label>Motivo<textarea name="motivo" maxlength="500" required></textarea></label><button class="secondary">Cerrar solicitud</button></form></section><section class="card" th:unless="${detalle.estado.name() == 'PENDIENTE'}"><h2>Curso solicitado</h2><p th:text="${detalle.programa.nombre + ' · ' + detalle.programa.grupo}"></p><p th:text="${detalle.programa.horario}"></p><p>La solicitud está cerrada y conserva sus datos. Para otro grupo, envía una nueva solicitud.</p></section></main><script src="/js/interfaz.js" defer></script></body></html>
