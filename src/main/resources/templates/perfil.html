<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/demo.css}"><title>Mi perfil · Plus Twenty</title><script src="/js/interfaz.js" defer></script></head><body class="public-body"><main class="public-main demo application-page" id="contenido"><header class="portal-head"><a href="/login">← Volver al acceso</a><a class="text-link" href="/cursos">Cursos</a></header><section class="hero"><span class="eyebrow">MI CUENTA</span><h1>Mis datos.</h1><p>Usuario de acceso: <strong th:text="${usuario}"></strong></p></section><p role="status" th:if="${success}" th:text="${success}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p><section class="card"><h2>Datos de contacto</h2><form method="post" th:action="@{/perfil}" th:object="${datos}"><label>Nombre<input th:field="*{nombre}" maxlength="120" autocomplete="name" required><small class="error" th:errors="*{nombre}"></small></label><label>Teléfono<input th:field="*{telefono}" type="tel" maxlength="20" autocomplete="tel" required><small class="error" th:errors="*{telefono}"></small></label><label>Correo electrónico (opcional)<input th:field="*{email}" type="email" maxlength="160" autocomplete="email"><small class="error" th:errors="*{email}"></small></label><button>Guardar mis datos</button></form></section><section class="card"><h2>Cambiar contraseña</h2><p>Al guardar tendrás que iniciar sesión nuevamente.</p><form method="post" th:action="@{/perfil/clave}"><label>Contraseña actual<input name="actual" type="password" autocomplete="current-password" required></label><label>Nueva contraseña<input name="nueva" type="password" minlength="10" maxlength="64" autocomplete="new-password" required><small>Entre 10 y 64 caracteres.</small></label><label>Repite la nueva contraseña<input name="repetir" type="password" minlength="10" maxlength="64" autocomplete="new-password" required></label><button>Actualizar contraseña</button></form></section></main></body></html>
