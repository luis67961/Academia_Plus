<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div}, pageTitle='Estudiantes', activeNav='estudiantes')}"><head><title>Estudiantes</title><script src="/js/interfaz.js" defer></script></head><body><div><section class="hero"><span class="eyebrow">SECRETARÍA</span><h2>Estudiantes.</h2><p>Contacto, apoderado, cursos y cuentas vinculadas en una misma ficha.</p></section><section class="card"><form class="row" method="get" action="/estudiantes"><label>Nombre o DNI<input name="q" th:value="${q}"></label><button>Buscar</button><a href="/estudiantes">Limpiar</a></form></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>DNI</th><th>Matrículas</th><th>Ficha</th></tr></thead><tbody><tr th:each="e:${estudiantes}"><td th:text="${e.nombre}"></td><td th:text="${e.dni}"></td><td th:text="${e.matriculas}"></td><td><a class="text-link" th:href="@{/estudiantes/{dni}(dni=${e.dni})}" th:attr="aria-label=${'Abrir ficha de ' + e.nombre}">Abrir ficha →</a></td></tr><tr th:if="${#lists.isEmpty(estudiantes)}"><td colspan="4">No hay estudiantes con esos datos.</td></tr></tbody></table></div></section></div></body></html>
