<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Matrícula - Plus Twenty</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <h1>Editar matrícula</h1>
    <form th:action="@{/matriculas/actualizar/{id}(id=${matricula.id})}" th:object="${matricula}" method="post">
        <label>Alumno: <input type="text" th:field="*{alumno}" required></label><br>
        <label>DNI:    
            <input type="text"
            th:field="*{dni}"
            required
            minlength="8"
            maxlength="8"
            pattern="[0-9]{8}"
            title="El DNI debe contener exactamente 8 digitos">
        </label><br>
        <label>Curso: <input type="text" th:field="*{curso}" required></label><br>
        <label>Turno:
            <select th:field="*{turno}" required>
                <option value="">Seleccione un turno</option>
                <option value="Mañana">Mañana</option>
                <option value="Tarde">Tarde</option>
                <option value="Noche">Noche</option>
            </select>
        </label><br>
        <label>Fecha: <input type="date" th:field="*{fecha}" required></label><br>
        <label>Estado:
            <select th:field="*{estado}">
                <option value="Activo">Activo</option>
                <option value="Pendiente">Pendiente</option>
            </select>
        </label><br>
        <button type="submit">Actualizar</button>
    </form>
    <a th:href="@{/matriculas}">Volver</a>
</body>
</html>
