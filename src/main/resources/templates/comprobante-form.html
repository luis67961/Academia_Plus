<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/demo.css}"><title>Enviar comprobante · Plus Twenty</title><script src="/js/interfaz.js" defer></script></head><body class="public-body"><main class="public-main demo application-page"><a class="text-link" href="/portal">← Mi academia</a><section class="hero"><span class="eyebrow">INFORMAR UN PAGO</span><h1>Tu comprobante.</h1><p th:text="${cuota.matricula.curso + ' · Cuota ' + cuota.numero + ' · Saldo S/ ' + #numbers.formatDecimal(cuota.saldo,1,2)}"></p></section><p role="alert" class="error" th:if="${error}" th:text="${error}"></p><section class="card"><form method="post" enctype="multipart/form-data" th:action="@{/portal/comprobantes}"><input type="hidden" name="cuotaId" th:value="${cuota.id}"><label>Monto pagado S/<input name="monto" th:value="${monto}" type="number" min="0.01" step="0.01" th:max="${cuota.saldo}" required></label><label>Medio de pago<select name="medio"><option value="Yape" th:selected="${medio == 'Yape'}">Yape</option><option value="Plin" th:selected="${medio == 'Plin'}">Plin</option><option value="Transferencia" th:selected="${medio == 'Transferencia'}">Transferencia</option></select></label><label>Número de operación<input name="referencia" th:value="${referencia}" maxlength="100" required></label><label>Adjunta el comprobante<input name="archivo" type="file" accept="image/png,image/jpeg,application/pdf" required><small>PNG, JPG o PDF. Hasta 5 MB.</small></label><p>El envío no descuenta la deuda automáticamente. Administración debe verificar que la operación haya llegado.</p><button>Enviar para revisión</button></form></section></main></body></html>
