<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div}, pageTitle='Cursos y grupos', activeNav='programas')}"><head><title>Cursos y grupos</title><script src="/js/interfaz.js" defer></script></head><body><div>
<section class="hero"><span class="eyebrow">OFERTA ACADÉMICA</span><h2>Cursos y grupos.</h2><p>Define horarios, docentes y vacantes. Cierra las inscripciones cuando lo necesites.</p></section><section class="card"><form class="row" method="get" action="/programas"><label>Curso, grupo o docente<input name="q" th:value="${q}"></label><button>Buscar</button><a href="/programas">Limpiar</a></form></section><section class="cards"><article class="card" th:each="p:${programas}"><span class="badge" th:text="${p.inscripcionesAbiertas ? 'Inscripciones abiertas' : 'Inscripciones cerradas'}"></span><h3 th:text="${p.nombre + ' · ' + p.grupo}"></h3><p th:text="${p.cursos}"></p><p th:text="${p.horario + ' · ' + p.turno}"></p><p th:text="${'Docente: ' + (p.docente == null or p.docente.isBlank() ? 'Por asignar' : p.docente)}"></p><p><strong th:text="${vacantes[p.id]}"></strong> vacantes de <span th:text="${p.cupo}"></span></p><p th:text="${p.cuotas + ' cuotas de S/ ' + #numbers.formatDecimal(p.pension,1,2)}"></p><a class="text-link" th:href="@{/programas/{id}/editar(id=${p.id})}">Editar grupo →</a> · <a class="text-link" th:href="@{/asistencia(programaId=${p.id})}">Asistencia</a></article></section>
<section class="card" id="formulario"><h3 th:text="${programa.id == null ? 'Registrar curso y grupo' : 'Editar curso y grupo'}"></h3><form method="post" th:action="${programa.id == null} ? @{/programas} : @{/programas/{id}/editar(id=${programa.id})}" th:object="${programa}"><div role="alert" class="validation-errors" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><div class="form-grid"><label>Nombre del curso<input th:field="*{nombre}" maxlength="100" required></label><label>Grupo<input th:field="*{grupo}" maxlength="80" required></label><label>Contenido<input th:field="*{cursos}" maxlength="500" required></label><label>Horario<input th:field="*{horario}" maxlength="160" required></label><label>Docente<input th:field="*{docente}" maxlength="120"></label><label>Turno<select th:field="*{turno}"><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option><option value="Noche">Noche</option></select></label><label>Capacidad del grupo<input th:field="*{cupo}" type="number" min="1" max="500" required></label><label>Número de cuotas<input th:field="*{cuotas}" type="number" min="1" max="12" required></label><label>Pensión S/<input th:field="*{pension}" type="number" min="1" max="100000" step="0.01" required></label></div><label class="consent"><input th:field="*{inscripcionesAbiertas}" type="checkbox"><span>Aceptar nuevas inscripciones</span></label><p>Los cambios de tarifa solo se aplican a nuevas matrículas. Los cronogramas existentes se conservan.</p><button>Guardar curso y grupo</button> <a class="text-link" href="/programas">Nuevo grupo</a></form></section></div></body></html>
