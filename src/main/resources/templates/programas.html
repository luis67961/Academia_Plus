<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div}, pageTitle='Cursos y grupos', activeNav='programas')}"><head><title>Cursos y grupos</title></head><body><div class="demo"><section class="hero"><span class="eyebrow">PLUS TWENTY</span><h2>Cursos y grupos.</h2><p>Matemática · Oratoria · Locución · Podcast</p></section><section class="cards"><article class="card" th:each="p:${programas}"><span class="badge" th:text="${p.grupo}"></span><h3 th:text="${p.nombre}"></h3><p th:text="${p.cursos}"></p><p th:text="${p.horario}"></p><strong th:text="${p.cuotas + ' cuotas de S/ ' + #numbers.formatDecimal(p.pension,1,2)}"></strong></article></section><section class="card"><h3>Registrar curso y grupo</h3><form method="post" th:action="@{/programas}" th:object="${programa}"><p class="error" th:if="${#fields.hasAnyErrors()}">Revise los datos: nombre, grupo, contenido y horario son obligatorios; indique de 1 a 12 cuotas y una pensión válida.</p><div class="form-grid"><label>Curso<select th:field="*{nombre}"><option value="Matemática">Matemática</option><option value="Oratoria">Oratoria</option><option value="Locución">Locución</option><option value="Podcast">Podcast</option></select></label><label>Grupo<input th:field="*{grupo}" maxlength="80" placeholder="Grupo A · Mañana" required></label><label>Contenido<input th:field="*{cursos}" maxlength="500" required></label><label>Horario<input th:field="*{horario}" maxlength="160" required></label><label>Número de cuotas<input th:field="*{cuotas}" type="number" min="1" max="12" required></label><label>Pensión S/<input th:field="*{pension}" type="number" min="1" max="100000" step="0.01" required></label></div><button>Guardar curso y grupo</button></form></section></div></body></html>
