<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
th:replace="~{layout :: html(content=~{::div}, pageTitle=${matricula.id == null ? 'Nueva Matrícula' : 'Editar Matrícula'}, activeNav='matriculas')}">
<head>
    <title>Formulario de Matrícula</title>
</head>
<body>
    <div>
        <div class="max-w-3xl mx-auto">

            <!-- Migas de pan -->
            <nav class="text-sm text-gray-500 mb-4 flex items-center gap-2">
                <a th:href="@{/matriculas}" class="hover:text-gray-800">Matrículas</a>
                <span>/</span>
                <span class="text-gray-800" th:text="${matricula.id == null ? 'Nueva' : 'Editar'}">Nueva</span>
            </nav>

            <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 md:p-8">
                <div class="mb-8">
                    <h2 class="text-xl font-semibold text-gray-800" th:text="${matricula.id == null ? 'Registrar Estudiante' : 'Actualizar Matrícula'}">Registrar Estudiante</h2>
                    <p class="text-sm text-gray-500 mt-1" th:if="${matricula.id == null}">Complete todos los campos para asentar la matrícula en el sistema.</p>
                    <p class="text-sm text-gray-500 mt-1" th:if="${matricula.id != null}">
                        Modifique los datos de <span class="font-medium text-gray-700" th:text="${matricula.alumno}">el estudiante</span> y guarde los cambios.
                    </p>
                </div>

                <form th:action="${matricula.id == null} ? @{/matriculas/guardar} : @{/matriculas/actualizar/{id}(id=${matricula.id})}"
                      th:object="${matricula}" method="post" class="space-y-6" novalidate>

                    <!-- Resumen de errores -->
                    <div th:if="${#fields.hasAnyErrors()}" class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">
                        <p class="font-medium mb-1">Revise los campos marcados:</p>
                        <ul class="list-disc list-inside space-y-0.5">
                            <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</li>
                        </ul>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <!-- DNI -->
                        <div>
                            <label for="dni" class="block text-sm font-medium text-gray-700 mb-1">DNI del Estudiante <span class="text-red-500">*</span></label>
                            <input type="text" id="dni" th:field="*{dni}" inputmode="numeric" maxlength="8" placeholder="Ej: 72890123" autocomplete="off"
                                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none transition-colors"
                                   th:classappend="${#fields.hasErrors('dni')} ? 'border-red-400 focus:ring-red-400 bg-red-50/40' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'">
                            <p class="text-xs text-red-600 mt-1" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></p>
                            <p class="text-xs text-gray-400 mt-1" th:unless="${#fields.hasErrors('dni')}">8 dígitos, sin puntos ni espacios.</p>
                        </div>

                        <!-- Nombre completo -->
                        <div>
                            <label for="alumno" class="block text-sm font-medium text-gray-700 mb-1">Nombre completo <span class="text-red-500">*</span></label>
                            <input type="text" id="alumno" th:field="*{alumno}" maxlength="120" placeholder="Nombres y apellidos"
                                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none transition-colors"
                                   th:classappend="${#fields.hasErrors('alumno')} ? 'border-red-400 focus:ring-red-400 bg-red-50/40' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'">
                            <p class="text-xs text-red-600 mt-1" th:if="${#fields.hasErrors('alumno')}" th:errors="*{alumno}"></p>
                        </div>

                        <!-- Curso -->
                        <div>
                            <label for="curso" class="block text-sm font-medium text-gray-700 mb-1">Curso <span class="text-red-500">*</span></label>
                            <select id="curso" th:field="*{curso}"
                                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none bg-white transition-colors"
                                    th:classappend="${#fields.hasErrors('curso')} ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'">
                                <option value="">Seleccione un curso</option>
                                <option th:each="c : ${cursos}" th:value="${c}" th:text="${c}">Matemática</option>
                            </select>
                            <p class="text-xs text-red-600 mt-1" th:if="${#fields.hasErrors('curso')}" th:errors="*{curso}"></p>
                        </div>

                        <!-- Turno -->
                        <div>
                            <label for="turno" class="block text-sm font-medium text-gray-700 mb-1">Turno <span class="text-red-500">*</span></label>
                            <select id="turno" th:field="*{turno}"
                                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none bg-white transition-colors"
                                    th:classappend="${#fields.hasErrors('turno')} ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'">
                                <option value="">Seleccione un turno</option>
                                <option th:each="t : ${turnos}" th:value="${t}" th:text="${t}">Mañana</option>
                            </select>
                            <p class="text-xs text-red-600 mt-1" th:if="${#fields.hasErrors('turno')}" th:errors="*{turno}"></p>
                        </div>

                        <!-- Fecha de registro -->
                        <div>
                            <label for="fecha" class="block text-sm font-medium text-gray-700 mb-1">Fecha de registro <span class="text-red-500">*</span></label>
                            <input type="date" id="fecha" th:field="*{fecha}"
                                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none bg-white transition-colors"
                                   th:classappend="${#fields.hasErrors('fecha')} ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'">
                            <p class="text-xs text-red-600 mt-1" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></p>
                        </div>

                        <!-- Estado -->
                        <div>
                            <label for="estado" class="block text-sm font-medium text-gray-700 mb-1">Estado <span class="text-red-500">*</span></label>
                            <select id="estado" th:field="*{estado}"
                                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none bg-white transition-colors"
                                    th:classappend="${#fields.hasErrors('estado')} ? 'border-red-400 focus:ring-red-400' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'">
                                <option th:each="e : ${estados}" th:value="${e}" th:text="${e == 'ACTIVA' ? 'Activa' : 'Inactiva'}">Activa</option>
                            </select>
                            <p class="text-xs text-red-600 mt-1" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></p>
                        </div>

                    </div>

                    <div class="border-t border-gray-100 pt-6 mt-8 flex items-center justify-end gap-3">
                        <a th:href="@{/matriculas}" class="px-5 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium transition-colors">
                            Cancelar
                        </a>
                        <button type="submit" class="px-5 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 font-medium transition-colors shadow-sm"
                                th:text="${matricula.id == null ? 'Guardar Matrícula' : 'Guardar Cambios'}">
                            Guardar Matrícula
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
