<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
th:replace="~{layout :: html(content=~{::div}, pageTitle='Nueva Matrícula')}">
<head>
    <title>Formulario de Matrícula</title>
</head>
<body>
    <div>
        <div class="max-w-3xl mx-auto bg-white rounded-xl border border-gray-100 shadow-sm p-6 md:p-8">
            <div class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800">Registrar Estudiante</h2>
                <p class="text-sm text-gray-500 mt-1">Complete todos los campos para asentar la matrícula en el sistema.</p>
            </div>

            <!-- NOTA PARA BACKEND: th:object asocia el formulario con el DTO o Entidad Matricula -->
            <form th:action="@{/matriculas/guardar}" th:object="${matricula}" method="POST" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- Campo DNI -->
                    <div>
                        <label for="dni" class="block text-sm font-medium text-gray-700 mb-1">DNI del Estudiante</label>
                        <input type="text" id="dni" th:field="*{estudiante.dni}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="Ej: 72890123" required>
                        <p class="text-xs text-red-500 mt-1" th:if="${#fields.hasErrors('estudiante.dni')}" th:errors="*{estudiante.dni}"></p>
                    </div>
                    
                    <!-- Campo Nombres -->
                    <div>
                        <label for="nombres" class="block text-sm font-medium text-gray-700 mb-1">Nombres</label>
                        <input type="text" id="nombres" th:field="*{estudiante.nombres}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="Nombres completos" required>
                    </div>

                    <!-- Campo Apellidos -->
                    <div>
                        <label for="apellidos" class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
                        <input type="text" id="apellidos" th:field="*{estudiante.apellidos}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" placeholder="Apellidos completos" required>
                    </div>

                    <!-- Campo Turno -->
                    <div>
                        <label for="turno" class="block text-sm font-medium text-gray-700 mb-1">Turno</label>
                        <select id="turno" th:field="*{turno}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition-colors">
                            <option value="MANANA">Mañana</option>
                            <option value="TARDE">Tarde</option>
                        </select>
                    </div>

                </div>

                <div class="border-t border-gray-100 pt-6 mt-8 flex items-center justify-end gap-3">
                    <a th:href="@{/matriculas}" class="px-5 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium transition-colors">
                        Cancelar
                    </a>
                    <button type="submit" class="px-5 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 font-medium transition-colors shadow-sm">
                        Guardar Matrícula
                    </button>
                </div>
            </form>

            <!-- DUMMY FORM SI EL OBJETO NO EXISTE AÚN DESDE EL CONTROLLER (Para maquetación) -->
            <form th:if="${matricula == null}" class="space-y-6 opacity-50 mt-10 border-t-4 border-dashed border-red-200 pt-10">
                <p class="text-red-500 text-sm font-bold mb-4">MOCKUP FORM (El backend no ha inyectado el objeto 'matricula')</p>
                <!-- Misma estructura visual que arriba -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">DNI del Estudiante</label>
                        <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg" disabled>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
