<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <!--
        Cabecera de columna ordenable. Usa las variables del contexto
        (q, estado, turno, size, sort, dir) para conservar los filtros activos.
    -->
    <th th:fragment="orden(campo, etiqueta, alineacion)" class="px-6 py-4 font-medium"
        th:classappend="${alineacion}">
        <a th:href="@{/matriculas(q=${q}, estado=${estado}, turno=${turno}, size=${size}, sort=${campo}, dir=${sort == campo and dir == 'asc'} ? 'desc' : 'asc')}"
           class="inline-flex items-center gap-1 hover:text-gray-800"
           th:classappend="${sort == campo} ? 'text-gray-800' : ''">
            <span th:text="${etiqueta}">Columna</span>
            <svg th:if="${sort == campo and dir == 'asc'}" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
            <svg th:if="${sort == campo and dir == 'desc'}" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            <svg th:if="${sort != campo}" class="w-3.5 h-3.5 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path></svg>
        </a>
    </th>

    <!-- Etiqueta de estado de matrícula -->
    <span th:fragment="estado(valor)"
          class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium"
          th:classappend="${valor == 'ACTIVA'} ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-200 text-gray-700'">
        <span class="w-1.5 h-1.5 rounded-full" th:classappend="${valor == 'ACTIVA'} ? 'bg-emerald-500' : 'bg-gray-500'"></span>
        <span th:text="${valor == 'ACTIVA'} ? 'Activa' : 'Inactiva'">Activa</span>
    </span>

</body>
</html>
