<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div}, pageTitle='Comprobantes por revisar', activeNav='comprobantes')}"><head><title>Comprobantes</title><script src="/js/interfaz.js" defer></script></head><body><div><section class="hero"><span class="eyebrow">VERIFICACIÓN DE PAGOS</span><h2>Comprobantes recibidos.</h2><p>Verifica la operación en el medio de pago antes de aprobar. La aprobación registra el abono y actualiza el saldo.</p></section><section class="card"><form class="row" method="get" action="/comprobantes"><label>Estudiante o número de operación<input name="q" th:value="${q}"></label><label>Estado<select name="estado"><option value="">Todos</option><option th:each="e:${T(com.plustwenty.academic.model.Comprobante.Estado).values()}" th:value="${e}" th:text="${e}" th:selected="${estado == e.name()}"></option></select></label><button>Filtrar</button></form></section><section class="card" th:each="c:${comprobantes}"><h3 th:text="${c.cuota.matricula.alumno + ' · ' + c.cuota.matricula.curso}"></h3><span class="badge" th:text="${c.estado}"></span><p th:text="${c.medio + ' · Operación ' + c.referencia + ' · S/ ' + #numbers.formatDecimal(c.monto,1,2)}"></p><p th:text="${'Cuota ' + c.cuota.numero + ' · Enviado ' + #temporals.format(c.fecha,'dd/MM/yyyy HH:mm')}"></p><a class="text-link" th:href="@{/comprobantes/{id}/archivo(id=${c.id})}">Descargar archivo →</a><div th:if="${c.estado.name() == 'PENDIENTE'}" class="review-actions"><form method="post" th:action="@{/comprobantes/{id}/revisar(id=${c.id})}" data-confirm="¿Verificaste que el dinero llegó? Se registrará el pago."><input type="hidden" name="aprobar" value="true"><label class="consent"><input type="checkbox" required><span>Verifiqué monto, operación y recepción del dinero.</span></label><button>Aprobar y registrar pago</button></form><form method="post" th:action="@{/comprobantes/{id}/revisar(id=${c.id})}" data-confirm="¿Rechazar este comprobante con el motivo indicado?"><input type="hidden" name="aprobar" value="false"><label>Motivo del rechazo<textarea name="motivo" maxlength="500" required></textarea></label><button class="secondary">Rechazar comprobante</button></form></div><p th:if="${c.motivo != null}" th:text="${c.motivo}"></p></section><section class="card" th:if="${#lists.isEmpty(comprobantes)}"><p>No hay comprobantes con esos filtros.</p></section></div></body></html>
