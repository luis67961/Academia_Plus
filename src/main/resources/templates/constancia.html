<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constancia interna de pago</title><style>body{font:16px Arial,sans-serif;color:#252824;margin:40px auto;padding:24px;max-width:720px}h1{font:36px Georgia,serif}dl{display:grid;grid-template-columns:180px 1fr;gap:16px;border-block:1px solid #ddd;padding:24px 0}dt{color:#666}dd{margin:0}a,button{display:inline-block;padding:12px;color:#315749}small{display:block;margin-top:32px}@media print{.actions{display:none}body{margin:0;max-width:none}}</style></head><body><p>PLUS TWENTY · ADMINISTRACIÓN</p><h1>Constancia interna de pago</h1><p th:text="${'N.º ' + pago.id}"></p><dl><dt>Estudiante</dt><dd th:text="${pago.cuota.matricula.alumno}"></dd><dt>DNI</dt><dd th:text="${pago.cuota.matricula.dni}"></dd><dt>Curso</dt><dd th:text="${pago.cuota.matricula.curso}"></dd><dt>Cuota</dt><dd th:text="${pago.cuota.numero}"></dd><dt>Fecha</dt><dd th:text="${#temporals.format(pago.fecha,'dd/MM/yyyy HH:mm')}"></dd><dt>Importe recibido</dt><dd th:text="${'S/ ' + #numbers.formatDecimal(pago.monto,1,2)}"></dd><dt>Medio de pago</dt><dd th:text="${pago.medio}"></dd><dt>Operación</dt><dd th:text="${pago.referencia == null or pago.referencia.isBlank() ? 'No aplica' : pago.referencia}"></dd></dl><small>Este documento acredita un registro interno de pago. No es una boleta ni una factura tributaria.</small><div class="actions" th:unless="${descargar}"><a th:href="${volver}">← Volver</a><a th:href="${ruta + '?descargar=true'}">Descargar constancia HTML</a><button onclick="window.print()">Imprimir / guardar como PDF</button></div></body></html>
